<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
    // DIRECT TEST SCRIPT FOR GUARANTEED SUGGESTION TOASTS
    document.addEventListener('DOMContentLoaded', () => {
      console.log('[DIRECT TEST] Adding card move detector');
      
      // Function to create and show a suggestion toast
      function showSuggestionToast(cardId, columnName) {
        // Create toast container if it doesn't exist
        let toastContainer = document.querySelector('.test-toast-container');
        if (!toastContainer) {
          toastContainer = document.createElement('div');
          toastContainer.className = 'test-toast-container';
          toastContainer.style.cssText = `
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
          `;
          document.body.appendChild(toastContainer);
        }
        
        // Create toast element
        const toast = document.createElement('div');
        toast.className = 'test-toast';
        toast.style.cssText = `
          background-color: #4f46e5;
          color: white;
          padding: 16px;
          border-radius: 8px;
          box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
          display: flex;
          justify-content: space-between;
          align-items: center;
          max-width: 400px;
          animation: slideIn 0.3s ease-out;
        `;
        
        // Add toast content
        toast.innerHTML = `
          <div>
            <div style="font-weight: bold; margin-bottom: 4px;">Prompt Assistant</div>
            <div>[DIRECT TEST] Suggestion available for column "${columnName || 'Column'}"</div>
          </div>
          <button 
            style="background: transparent; border: 1px solid white; color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer;"
            onclick="alert('Review button clicked for card ${cardId}')">
            Review
          </button>
        `;
        
        // Add the toast to the container
        toastContainer.appendChild(toast);
        
        // Add animation keyframes
        if (!document.querySelector('#toast-animation')) {
          const style = document.createElement('style');
          style.id = 'toast-animation';
          style.textContent = `
            @keyframes slideIn {
              from { transform: translateX(100%); opacity: 0; }
              to { transform: translateX(0); opacity: 1; }
            }
          `;
          document.head.appendChild(style);
        }
        
        // Auto-remove after 5 seconds
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(100%)';
          toast.style.transition = 'all 0.3s ease-out';
          setTimeout(() => toast.remove(), 300);
        }, 5000);
        
        console.log(`[DIRECT TEST] Guaranteed test toast shown for card ${cardId}`);
      }
      
      // Track drag operations using mousedown/up events
      let dragStartTarget = null;
      
      // Add drag start detection
      document.addEventListener('mousedown', (e) => {
        // Look for card elements
        let cardElement = e.target.closest('[data-card-id]');
        if (cardElement) {
          dragStartTarget = {
            cardId: cardElement.dataset.cardId,
            columnId: cardElement.closest('[data-column-id]')?.dataset.columnId,
            columnName: cardElement.closest('[data-column-id]')?.querySelector('h3')?.textContent || 'Column'
          };
          console.log(`[DIRECT TEST] Drag start detected for card ${dragStartTarget.cardId}`);
        }
      });
      
      // Add drag end detection
      document.addEventListener('mouseup', () => {
        if (dragStartTarget) {
          // When mouse is released and we had an active drag, check if it was a card being moved
          console.log(`[DIRECT TEST] Drag ended, might have moved card ${dragStartTarget.cardId}`);
          
          // Wait a brief moment for DOM changes to settle
          setTimeout(() => {
            // Show "card moved" toast
            console.log(`[DIRECT TEST] Showing suggestion toast for card ${dragStartTarget.cardId} from ${dragStartTarget.columnName}`);
            showSuggestionToast(dragStartTarget.cardId, dragStartTarget.columnName);
            dragStartTarget = null;
          }, 1500);
        }
      });
      
      // Fallback mechanism - periodically check for cards
      setInterval(() => {
        const cards = document.querySelectorAll('[data-card-id]');
        if (cards.length > 0) {
          console.log(`[DIRECT TEST] ${cards.length} cards found on page`);
        }
      }, 5000);
    });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
