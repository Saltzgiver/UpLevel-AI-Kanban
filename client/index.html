<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
    // ULTRA DIRECT TEST SCRIPT FOR GUARANTEED SUGGESTION TOASTS
    // VERSION 2: INTERCEPT FETCH CALLS
    document.addEventListener('DOMContentLoaded', () => {
      console.log('[ULTRA DIRECT TEST] Adding network interceptor for card moves');
      
      // Function to create and show a suggestion toast
      function showSuggestionToast(cardId, columnId) {
        console.log(`[ULTRA DIRECT TEST] Creating guaranteed suggestion toast for card ${cardId}, column ${columnId}`);
        
        // Create toast container if it doesn't exist
        let toastContainer = document.querySelector('.ultra-test-toast-container');
        if (!toastContainer) {
          toastContainer = document.createElement('div');
          toastContainer.className = 'ultra-test-toast-container';
          toastContainer.style.cssText = `
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
          `;
          document.body.appendChild(toastContainer);
        }
        
        // Create toast element
        const toast = document.createElement('div');
        toast.className = 'ultra-test-toast';
        toast.style.cssText = `
          background-color: #6366f1;
          color: white;
          padding: 16px;
          border-radius: 8px;
          box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
          display: flex;
          justify-content: space-between;
          align-items: center;
          min-width: 280px;
          max-width: 400px;
          animation: ultraSlideIn 0.4s ease-out;
          border-left: 4px solid #818cf8;
        `;
        
        // Add toast content
        toast.innerHTML = `
          <div>
            <div style="font-weight: bold; margin-bottom: 4px; font-size: 15px;">✨ Prompt Assistant</div>
            <div style="font-size: 13px;">[ULTRA DIRECT] Suggestion available for column ${columnId}</div>
          </div>
          <button 
            style="background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: all 0.2s;"
            onmouseover="this.style.background='rgba(255,255,255,0.3)'"
            onmouseout="this.style.background='rgba(255,255,255,0.2)'"
            onclick="alert('Review button clicked for card ${cardId} in column ${columnId}')">
            Review
          </button>
        `;
        
        // Add the toast to the container
        toastContainer.appendChild(toast);
        
        // Add animation keyframes
        if (!document.querySelector('#ultra-toast-animation')) {
          const style = document.createElement('style');
          style.id = 'ultra-toast-animation';
          style.textContent = `
            @keyframes ultraSlideIn {
              from { transform: translateX(120%); opacity: 0; }
              to { transform: translateX(0); opacity: 1; }
            }
          `;
          document.head.appendChild(style);
        }
        
        // Auto-remove after 8 seconds
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateX(120%)';
          toast.style.transition = 'all 0.4s ease-out';
          setTimeout(() => toast.remove(), 400);
        }, 8000);
        
        console.log(`[ULTRA DIRECT TEST] Guaranteed test toast shown for card ${cardId}`);
      }
      
      // Intercept all fetch calls to detect card moves
      const originalFetch = window.fetch;
      window.fetch = async function(input, init) {
        const url = typeof input === 'string' ? input : input.url;
        
        // Detect card move API calls
        if (url.includes('/api/cards/') && url.includes('/move')) {
          console.log(`[ULTRA DIRECT TEST] Detected card move API call: ${url}`);
          
          // Extract card and column IDs
          const urlParts = url.split('/');
          const cardIdIndex = urlParts.indexOf('cards') + 1;
          const cardId = cardIdIndex < urlParts.length ? urlParts[cardIdIndex] : null;
          
          // Process with the original fetch
          const response = await originalFetch.apply(this, arguments);
          
          // After the move is complete, show our toast
          if (response.ok) {
            // Clone the response as it can only be read once
            const clonedResponse = response.clone();
            
            // Read the JSON to get the destination column ID
            try {
              const data = await clonedResponse.json();
              const destinationColumnId = data.columnId;
              
              console.log(`[ULTRA DIRECT TEST] Card ${cardId} successfully moved to column ${destinationColumnId}`);
              
              // Show our guaranteed toast after a short delay (let the move complete first)
              setTimeout(() => {
                showSuggestionToast(cardId, destinationColumnId);
              }, 1000);
            } catch (error) {
              console.error('[ULTRA DIRECT TEST] Error processing response:', error);
            }
          }
          
          return response;
        }
        
        // For all other requests, just pass through
        return originalFetch.apply(this, arguments);
      };
      
      console.log('[ULTRA DIRECT TEST] Fetch interceptor installed successfully');
    });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
