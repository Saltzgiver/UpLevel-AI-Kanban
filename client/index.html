<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <script>
      // Intercept fetch API to detect card move operations and trigger suggestion toasts
      (function() {
        console.log('[Prompt Assistant] Installing fetch interceptor for card movements');
        
        // Store original fetch function
        const originalFetch = window.fetch;
        
        // Replace with our interceptor
        window.fetch = async function(resource, init) {
          // Call original fetch
          const response = await originalFetch.apply(this, arguments);
          
          try {
            // Only process if it's a card move request
            if (resource && typeof resource === 'string' && resource.includes('/api/cards/') && resource.includes('/move')) {
              // Extract card and column IDs from the URL and body
              const cardIdMatch = resource.match(/\/api\/cards\/(\d+)\/move/);
              const cardId = cardIdMatch ? parseInt(cardIdMatch[1]) : null;
              
              if (cardId && response.ok) {
                // Process the request body to get destination column
                if (init && init.body) {
                  try {
                    // Parse the request body to get source and destination columns
                    const requestBody = typeof init.body === 'string' ? JSON.parse(init.body) : {};
                    const sourceColumnId = requestBody.sourceColumnId;
                    const destinationColumnId = requestBody.destinationColumnId;
                    
                    console.log(`[Prompt Assistant] Card ${cardId} moved from column ${sourceColumnId} to ${destinationColumnId}`);
                    
                    // If the source column exists and is different from destination,
                    // this is a move between columns which might generate a suggestion
                    if (sourceColumnId && sourceColumnId !== destinationColumnId) {
                      // Start checking for suggestions with multiple attempts
                      let attempts = 0;
                      const maxAttempts = 5;
                      const checkInterval = 1000; // 1 second between checks
                      
                      const checkForSuggestion = async () => {
                        if (attempts >= maxAttempts) {
                          console.log(`[Prompt Assistant] No suggestion found after ${maxAttempts} attempts`);
                          return;
                        }
                        
                        attempts++;
                        console.log(`[Prompt Assistant] Checking for suggestion (attempt ${attempts}/${maxAttempts})`);
                        
                        try {
                          // Check for a suggestion specific to this card
                          const cardSpecificEndpoint = `/api/columns/${sourceColumnId}/prompt-suggestion/status/${cardId}`;
                          const suggestionResponse = await originalFetch(cardSpecificEndpoint);
                          
                          if (suggestionResponse.ok) {
                            const suggestionData = await suggestionResponse.json();
                            
                            console.log(`[Prompt Assistant] Suggestion check result:`, suggestionData);
                            
                            if (suggestionData.hasSuggestion) {
                              console.log(`[Prompt Assistant] Suggestion available for column ${sourceColumnId}, card ${cardId}`);
                              
                              // Dispatch custom event to show suggestion toast
                              const event = new CustomEvent('promptSuggestionAvailable', {
                                detail: {
                                  columnId: sourceColumnId,
                                  cardId: cardId
                                }
                              });
                              window.dispatchEvent(event);
                              console.log(`[Prompt Assistant] Event dispatched to show suggestion toast`);
                              return; // Exit the polling cycle
                            } else if (attempts < maxAttempts) {
                              // Continue checking if no suggestion yet
                              setTimeout(checkForSuggestion, checkInterval);
                            }
                          } else {
                            console.log(`[Prompt Assistant] Suggestion check failed with status: ${suggestionResponse.status}`);
                            
                            // Try the generic endpoint as fallback
                            const genericEndpoint = `/api/columns/${sourceColumnId}/prompt-suggestion/status`;
                            const fallbackResponse = await originalFetch(genericEndpoint);
                            
                            if (fallbackResponse.ok) {
                              const fallbackData = await fallbackResponse.json();
                              
                              if (fallbackData.hasSuggestion) {
                                console.log(`[Prompt Assistant] Suggestion available from fallback check`);
                                
                                const event = new CustomEvent('promptSuggestionAvailable', {
                                  detail: {
                                    columnId: sourceColumnId,
                                    cardId: cardId
                                  }
                                });
                                window.dispatchEvent(event);
                                return; // Exit the polling cycle
                              }
                            }
                            
                            // Continue checking if we haven't reached max attempts
                            if (attempts < maxAttempts) {
                              setTimeout(checkForSuggestion, checkInterval);
                            }
                          }
                        } catch (error) {
                          console.error('[Prompt Assistant] Error checking for suggestions:', error);
                          // Continue checking if we haven't reached max attempts
                          if (attempts < maxAttempts) {
                            setTimeout(checkForSuggestion, checkInterval);
                          }
                        }
                      };
                      
                      // Wait a short time before first check to allow backend to process
                      setTimeout(checkForSuggestion, 1000);
                    }
                  } catch (e) {
                    console.error('[Prompt Assistant] Error parsing request body:', e);
                  }
                }
              }
            }
          } catch (error) {
            console.error('[Prompt Assistant] Error in fetch interceptor:', error);
          }
          
          // Return original response regardless of our processing
          return response;
        };
        
        console.log('[Prompt Assistant] Fetch interceptor successfully installed');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
